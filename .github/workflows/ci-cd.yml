name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  playwright-ui-tests:
    name: Playwright UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui-tests/package-lock.json

      - name: Install Playwright dependencies
        working-directory: ./ui-tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./ui-tests
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ./ui-tests
        run: npm test

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui-tests/playwright-report/
          retention-days: 30

      - name: Upload Playwright test results (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: ui-tests/playwright-report/index.html
          retention-days: 30

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: ui-tests/allure-results/
          retention-days: 30

  postman-api-tests:
    name: Postman API Tests (Newman)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find api-tests directory
        id: find-dir
        run: |
          if [ -d "api-tests:" ]; then
            echo "dir=api-tests:" >> $GITHUB_OUTPUT
          elif [ -d "api-tests" ]; then
            echo "dir=api-tests" >> $GITHUB_OUTPUT
          else
            echo "Directory not found" && exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ steps.find-dir.outputs.dir }}/package-lock.json"

      - name: Install Newman dependencies
        working-directory: ./${{ steps.find-dir.outputs.dir }}
        run: npm ci

      - name: Run Newman tests
        working-directory: ./${{ steps.find-dir.outputs.dir }}
        run: |
          npx newman run "collection/Simple Grocery Store API - Automation.postman_collection.json" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export report.html \
            --reporter-htmlextra-title "API Test Report" \
            --reporter-htmlextra-browserTitle "API Test Results" \
            --reporter-htmlextra-showOnlyFails false \
            --reporter-htmlextra-hideRequestBody false \
            --reporter-htmlextra-hideResponseBody false

      - name: Verify report.html location
        run: |
          echo "Looking for report.html..."
          find . -name "report.html" -type f 2>/dev/null || echo "report.html not found"
          ls -la ${{ steps.find-dir.outputs.dir }}/report.html 2>/dev/null || echo "Not found at expected path"

      - name: Upload Newman test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: |
            ${{ steps.find-dir.outputs.dir }}/report.html
            **/report.html
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Newman JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-json-results
          path: "${{ steps.find-dir.outputs.dir }}/"
          retention-days: 30
          if-no-files-found: warn
        continue-on-error: true

  k6-performance-tests:
    name: k6 Performance Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find performance-tests directory
        id: find-perf-dir
        run: |
          if [ -d "performance-tests:" ]; then
            echo "dir=performance-tests:" >> $GITHUB_OUTPUT
          elif [ -d "performance-tests" ]; then
            echo "dir=performance-tests" >> $GITHUB_OUTPUT
          else
            echo "Directory not found" && exit 1
          fi

      - name: Run k6 performance tests
        uses: grafana/k6-action@v0.3.0
        with:
          filename: "${{ steps.find-perf-dir.outputs.dir }}/create-order.test.js"

      - name: Upload k6 performance test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-report
          path: |
            summary.html
            ./summary.html
            ${{ steps.find-perf-dir.outputs.dir }}/summary.html
          retention-days: 30
          if-no-files-found: warn
